name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot:
    uses: xt0rted/.github/.github/workflows/dependabot-auto-merge.yml@cb2d8c639d7292c04de6e740bf557e7b8f751f7f # main
    secrets:
      GITHUB_APP_ID: ${{ secrets.DEPENDAMERGE_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.DEPENDAMERGE_PRIVATE_KEY }}
