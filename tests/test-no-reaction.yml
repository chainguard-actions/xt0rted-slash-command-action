name: Test slash command with no reaction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          command: build
          reaction: "false"
          allow-edits: "true"
          permission-level: read
      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CMD_NAME: ${{ steps.action.outputs.command-name }}
          CMD_ARGS: ${{ steps.action.outputs.command-arguments }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-name: $CMD_NAME"
          echo "command-arguments: $CMD_ARGS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no issue_comment event context under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
